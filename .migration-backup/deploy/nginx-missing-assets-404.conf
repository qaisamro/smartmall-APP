# Paste INSIDE the server { } block of the site's vhost config
# Place BEFORE the default location / block.

# Static assets & files: serve directly, return 404 if missing.
# Never fall back to index.html so the CDN cannot cache text/html for .js/.css/.png...
location ~* ^/assets/.*\.(?:js|mjs|css|json|map|png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf|eot|otf|mp3|webmanifest)$ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
}

# Root-level static files (sw.js, manifest.json, logos, sounds, ...)
location ~* \.(?:js|mjs|css|json|map|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|eot|mp3|webmanifest)$ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
}

# Everything else = SPA -> index.html
location / {
    try_files $uri $uri/ /index.html;
}
