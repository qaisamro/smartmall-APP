<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بطاقات حسابات SmartMall</title>
    <style>
        :root {
            --primary: #3b82f6;
            --primary-dark: #1e40af;
            --primary-gradient: linear-gradient(135deg, #3b82f6 0%, #2563eb 50%, #1d4ed8 100%);
            --bg: #f3f5f9;
            --card-bg: #ffffff;
            --border: #e2e8f0;
            --text: #1e293b;
            --muted: #64748b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        /* ───────── Toplevel action bar (screen only) ───────── */
        .topbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 18px 24px;
            background: var(--primary-gradient);
            color: #fff;
        }
        .topbar h1 { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
        .topbar p { font-size: 13px; opacity: .9; }
        .print-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 22px;
            border: none;
            border-radius: 12px;
            background: #fff;
            color: var(--primary-dark);
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0,0,0,.15);
            transition: transform .15s ease;
        }
        .print-btn:hover { transform: translateY(-2px); }
        .print-btn svg { width: 18px; height: 18px; }

        /* ───────── Cards stack (screen and print) ───────── */
        .cards-wrap {
            max-width: 900px;
            margin: 0 auto;
            padding: 24px 16px 60px;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(30, 64, 175, .08);
            border: 1px solid var(--border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            page-break-after: always;
            break-after: page;
        }
        /* Prevent extra blank page after last card in print */
        .card:last-child { page-break-after: auto; break-after: auto; }

        /* Official letterhead (top of each printed page) */
        .letterhead {
            background: #fff;
            padding: 10px 24px 6px;
            border-bottom: none;
            text-align: center;
            position: relative;
        }
        .letterhead::before,
        .letterhead::after {
            content: "";
            display: block;
            height: 3px;
            margin: 0 auto;
            border-radius: 99px;
        }
        .letterhead::before {
            width: 100%;
            background: linear-gradient(90deg, transparent, #1e40af 20%, #2563eb 50%, #1e40af 80%, transparent);
            margin-bottom: 12px;
        }
        .letterhead::after {
            width: 60%;
            background: linear-gradient(90deg, transparent, #93c5fd, transparent);
            margin-top: 12px;
        }
        .lh-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }
        .lh-brand {
            display: flex;
            align-items: center;
            gap: 14px;
            text-align: right;
        }
        .lh-brand img {
            width: 48px;
            height: 48px;
            object-fit: contain;
            border-radius: 12px;
            border: 2px solid #dbeafe;
            background: #fff;
            padding: 3px;
        }
        .lh-brand .lh-name b {
            display: block;
            font-size: 21px;
            font-weight: 900;
            color: var(--primary-dark);
            line-height: 1.2;
            letter-spacing: .3px;
        }
        .lh-brand .lh-name span {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: var(--muted);
            margin-top: 2px;
            letter-spacing: .2px;
        }
        .lh-title {
            font-size: 15px;
            font-weight: 900;
            color: #1e293b;
            background: linear-gradient(90deg, #eff6ff, #fff, #eff6ff);
            border: 1px solid #dbeafe;
            border-radius: 99px;
            padding: 8px 22px;
            white-space: nowrap;
        }
        .lh-ref {
            text-align: left;
            font-size: 10.5px;
            line-height: 1.7;
            color: #475569;
        }
        .lh-ref b { color: var(--primary-dark); }

        /* Header */
        .card-head {
            background: var(--primary-gradient);
            color: #fff;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .site-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: rgba(255,255,255,.16);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,.3);
            min-width: 86px;
        }
        .site-logo img {
            width: 40px;
            height: 40px;
            object-fit: contain;
            border-radius: 8px;
            background: #fff;
            padding: 2px;
        }
        .site-logo .brand {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }
        .site-logo .brand b { font-size: 13px; font-weight: 800; }
        .site-logo .brand span { font-size: 9px; font-weight: 700; opacity: .95; letter-spacing: .2px; }
        .mall-head { flex: 1; }
        .mall-head h2 { font-size: 22px; font-weight: 800; margin-top: 6px; }
        .mall-head .admin { font-size: 13px; font-weight: 600; opacity: .92; margin-top: 4px; }
        .mall-head .admin span { font-weight: 800; }
        .card-qr {
            width: 78px;
            height: 78px;
            background: #fff;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,.35);
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .card-qr svg { width: 100%; height: 100%; display: block; }

        /* Body */
        .card-body { padding: 16px 24px; display: flex; flex-direction: column; gap: 14px; }

        .section-title {
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .5px;
            color: var(--primary-dark);
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
        }
        .section-title::after { content: ""; flex: 1; height: 1px; background: var(--border); }

        /* Credentials */
        .creds {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .field {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 9px 12px;
        }
        .field label {
            font-size: 11px;
            font-weight: 800;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
        }
        .field .value {
            font-size: 15px;
            font-weight: 700;
            font-family: 'Consolas', 'Menlo', monospace;
            direction: ltr;
            text-align: left;
            color: var(--text);
            word-break: break-all;
            user-select: all;
        }
        .field.pass .value { color: var(--primary-dark); }

        /* Steps */
        .steps { display: flex; flex-direction: column; gap: 6px; }
        .step {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 7px 12px;
            font-size: 13px;
        }
        .step .num {
            flex-shrink: 0;
            width: 22px; height: 22px;
            border-radius: 50%;
            background: var(--primary-gradient);
            color: #fff;
            font-size: 12px;
            font-weight: 800;
            display: flex; align-items: center; justify-content: center;
            margin-top: 1px;
        }
        .site-link { font-size: 13px; font-weight: 700; color: var(--primary-dark); }

        /* Footer */
        .card-foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 24px;
            background: #f1f5f9;
            border-top: 1px solid var(--border);
            font-size: 12px;
            flex-wrap: wrap;
        }
        .meta { display: flex; align-items: center; gap: 8px; color: var(--muted); font-weight: 700; }
        .meta b { color: var(--primary-dark); direction: ltr; }
        .card-foot .contact { color: var(--primary-dark); }

        .contact-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 10px 24px;
            padding: 8px 24px;
            background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 100%);
            border-top: 1px dashed var(--border);
            font-size: 13px;
        }
        .contact-item { display: flex; align-items: center; gap: 6px; font-weight: 700; color: var(--text); }
        .contact-item b { color: var(--primary-dark); }

        /* Device guide inside each card */
        .device-guide {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 10px 14px;
        }
        .dg-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 14px;
        }
        .dg-item h4 { font-size: 12px; font-weight: 800; color: var(--text); margin-bottom: 3px; }
        .dg-item ol { padding-inline-start: 16px; font-size: 11.5px; }
        .dg-item li { margin-bottom: 1px; }

        /* ───────── Print rules: one card per page ───────── */
        @media print {
            @page { size: A4; margin: 9mm 10mm; }
            html, body { background: #fff; }
            .topbar { display: none; }
            .print-btn { display: none !important; }
            .cards-wrap { padding: 0; gap: 0; max-width: none; }
            .card {
                height: 279mm;
                box-shadow: none;
                border: 1px solid #cbd5e1;
                border-radius: 0;
                break-inside: avoid;
                page-break-inside: avoid;
                overflow: hidden;
            }
            .card-body { flex: 1; }
        }

        /* ───────── Responsive ───────── */
        @media (max-width: 600px) {
            .creds { grid-template-columns: 1fr; }
            .dg-list { grid-template-columns: 1fr; }
            .card-head { flex-wrap: wrap; }
            .mall-head h2 { font-size: 19px; }
            .topbar { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>

        const CARDS = [

        document.querySelectorAll('.card-qr').forEach((el) => {

            el.innerHTML = qr;
        });

        function generateQR(text) {
            const size = 21;
            const qr = qrcode(0, 'M');
            qr.addData(text);
            qr.make();
            const mods = qr.getModuleCount();
            const cell = 3;
            const pad = 2;
            const total = mods * cell + pad * 2;
            let cells = '';
            for (let r = 0; r < mods; r++) {
                for (let c = 0; c < mods; c++) {
                    if (qr.isDark(r, c)) {
                        cells += `<rect x="${pad + c * cell}" y="${pad + r * cell}" width="${cell}" height="${cell}"/>`;
                    }
                }
            }
            return `<svg width="${total}" height="${total}" viewBox="0 0 ${total} ${total}" xmlns="http://www.w3.org/2000/svg"><rect width="${total}" height="${total}" fill="#ffffff"/><path fill="#1e40af" d="${''}"/>${cells}</svg>`;
