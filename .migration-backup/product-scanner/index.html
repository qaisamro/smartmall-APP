<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ماسح المنتجات</title>
<link rel="manifest" href="manifest.json">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:system-ui; background:#000; color:#fff; text-align:center; padding:15px; }
h1 { font-size:20px; margin:10px 0; }
.owner-info { font-size:14px; color:#aaa; margin-bottom:10px; background:#111; padding:8px 12px; border-radius:8px; display:inline-block; }
.vid-wrap { position:relative; display:inline-block; max-width:500px; width:100%; }
#video { width:100%; border-radius:12px; }
#overlay { position:absolute; top:0; left:0; width:100%; height:100%; border:3px solid #0f0; border-radius:12px; pointer-events:none; opacity:0.7; }
canvas { display:none; }
#result { margin-top:12px; padding:12px; border-radius:8px; background:#111; min-height:40px; }
.barcode { font-size:24px; font-weight:700; color:#0f0; direction:ltr; letter-spacing:2px; }
.status { font-size:14px; color:#aaa; margin-top:4px; }
#capture-btn { display:none; margin:12px auto; padding:14px 32px; background:#007bff; color:#fff; border:none; border-radius:8px; font-size:18px; cursor:pointer; }
.product-img { margin-top:10px; border-radius:8px; max-width:200px; border:2px solid #333; }
.info { font-size:13px; color:#888; margin-top:10px; line-height:1.5; }
.loading { color:#ffc107; }
.error { color:#e94560; }
</style>
</head>
<body>

<h1>📷 ماسح المنتجات</h1>
<div id="ownerDisplay" class="owner-info"></div>

<div class="vid-wrap">
    <video id="video" autoplay playsinline></video>
    <div id="overlay"></div>
</div>
<canvas id="canvas"></canvas>

<div id="result">
    <div id="status" class="status">⏳ انتظر الكاميرا...</div>
    <div id="barcode" class="barcode"></div>
    <div id="productInfo"></div>
</div>

<button id="capture-btn" onclick="captureImage()">📸 التقاط صورة المنتج</button>

<div class="info">
    1. وجّه الكاميرا للباركود على المنتج<br>
    2. سيقرأ الباركود تلقائياً<br>
    3. التقط صورة للمنتج
</div>

<script>
// ===== قراءة owner من رابط QR =====
const params = new URLSearchParams(window.location.search);
const OWNER_ID = params.get('owner') || '';

if (OWNER_ID) {
    document.getElementById('ownerDisplay').textContent = '🔑 الكود: ' + OWNER_ID;
} else {
    document.getElementById('ownerDisplay').textContent = '⚠️ هذا الرابط غير صالح';
    document.getElementById('status').textContent = '❌ امسح QR الخاص بالمول أو السوبرماركت';
}

// ===== الكاميرا =====
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let stream = null;

async function startCamera() {
    try {
        stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } }
        });
        video.srcObject = stream;
        await video.play();
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        return true;
    } catch (e) {
        document.getElementById('status').textContent = '❌ الكاميرا: ' + e.message;
        return false;
    }
}

function captureFrame() {
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
}

// ===== كاشف الباركود =====
let detector = null;

async function initDetector() {
    if (!('BarcodeDetector' in window)) {
        document.getElementById('status').textContent = '⚠️ استخدم Chrome على الموبايل';
        return false;
    }
    try {
        const formats = ['ean_13','ean_8','upc_a','upc_e','code_128','code_39','codabar','itf','qr_code'];
        const supported = await BarcodeDetector.getSupportedFormats();
        detector = new BarcodeDetector({
            formats: formats.filter(f => supported.includes(f))
        });
        return true;
    } catch (e) {
        document.getElementById('status').textContent = '❌ فشل تحميل الكاشف';
        return false;
    }
}

let lastBarcode = '';

async function scanLoop() {
    if (!detector || !OWNER_ID) return;

    captureFrame();
    try {
        const barcodes = await detector.detect(canvas);
        if (barcodes.length > 0) {
            const b = barcodes[0];
            if (b.rawValue !== lastBarcode) {
                lastBarcode = b.rawValue;
                document.getElementById('barcode').textContent = b.rawValue;
                document.getElementById('status').textContent = '✅ تم القراءة — ' + b.format;
                document.getElementById('capture-btn').style.display = 'block';
                await checkBarcode(b.rawValue);
            }
        }
    } catch (e) {}
    setTimeout(scanLoop, 400);
}

async function checkBarcode(barcode) {
    try {
        const resp = await fetch('php/check-barcode.php?barcode=' + encodeURIComponent(barcode) + '&owner=' + encodeURIComponent(OWNER_ID));
        const data = await resp.json();
        if (data.exists) {
            document.getElementById('productInfo').innerHTML =
                '<div style="color:#0f0">✅ مسجل مسبقاً</div>' +
                '<img src="' + data.image_path + '?t=' + Date.now() + '" class="product-img">';
            document.getElementById('capture-btn').style.display = 'none';
        } else {
            document.getElementById('productInfo').innerHTML = '<div style="color:#ffc107">🆕 منتج جديد — التقط صورة</div>';
            document.getElementById('capture-btn').style.display = 'block';
        }
    } catch (e) {
        document.getElementById('productInfo').innerHTML = '<div class="error">❌ خطأ في الاتصال</div>';
    }
}

async function captureImage() {
    captureFrame();
    const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.8));
    const fd = new FormData();
    fd.append('barcode', lastBarcode);
    fd.append('owner', OWNER_ID);
    fd.append('image', blob, lastBarcode + '.jpg');

    document.getElementById('status').textContent = '⏳ جاري الحفظ...';

    try {
        const resp = await fetch('php/save-product.php', { method: 'POST', body: fd });
        const data = await resp.json();
        if (data.success) {
            document.getElementById('productInfo').innerHTML =
                '<div style="color:#0f0">✅ تم الحفظ</div>' +
                '<img src="' + data.image_path + '?t=' + Date.now() + '" class="product-img">';
            document.getElementById('capture-btn').style.display = 'none';
            document.getElementById('status').textContent = '✅ حفظ بنجاح';
        } else {
            document.getElementById('status').textContent = '❌ فشل الحفظ';
        }
    } catch (e) {
        document.getElementById('status').textContent = '❌ خطأ في الرفع';
    }
}

// ===== بدء التطبيق =====
(async () => {
    if (!OWNER_ID) return;
    const cam = await startCamera();
    if (!cam) return;
    const det = await initDetector();
    if (!det) return;
    document.getElementById('status').textContent = '🔍 وجّه الكاميرا للباركود';
    scanLoop();
})();
</script>

</body>
</html>
