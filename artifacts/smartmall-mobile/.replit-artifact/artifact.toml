kind = "mobile"
previewPath = "/mobile/"
title = "SmartMall Mobile"
description = "An independent React Native and Expo mobile client foundation for SmartMall, designed to connect securely to the existing Laravel API."
version = "1.0.0"
id = "artifacts/smartmall-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 23056

[services.development]
run = "pnpm --filter @workspace/smartmall-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/smartmall-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/smartmall-mobile", "run", "serve" ]

[services.env]
PORT = "23056"
BASE_PATH = "/mobile/"
