<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartMall</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center}
</style>
</head>
<body>
<script>
(function(){
  const params = new URLSearchParams(location.search);
  const title = params.get('title') || 'SmartMall';
  const body = params.get('body') || '';
  const url = params.get('url') || '/notifications';

  // Play custom sound (respect saved sound settings)
  var settings = { enabled: true, volume: 50 };
  try {
    var raw = localStorage.getItem('notif_sound_settings');
    if (raw) { settings = Object.assign(settings, JSON.parse(raw)); }
  } catch(e) {}

  if (settings.enabled && settings.volume > 0) {
    try {
      var a = new Audio('/sound.mp3');
      a.volume = settings.volume / 100;
      a.play().catch(function(){});
    } catch(e) {}
  }

  // Try to close this window/tab immediately
  try { window.close(); } catch(e) {}

  // If close fails, redirect to app (or the notification URL)
  setTimeout(function(){
    try { location.href = url; } catch(e) {}
  }, 100);
})();
</script>
</body>
</html>
